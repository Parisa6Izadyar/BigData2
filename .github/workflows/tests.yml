name: Validate river forecasting

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/execute_notebook.py --demo
      - run: python scripts/execute_notebook.py
        if: hashFiles('data/RIVER_TRAIN_DATASET_A1.xlsx') != ''
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: river-forecast-results
          path: |
            results/demo/metrics.json
            results/demo/forecast_comparison.png
            results/reproduced/metrics.json
            results/reproduced/forecast_comparison.png
